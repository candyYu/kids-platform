<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>跳转中…</title>
    <script>
      // GitHub Pages 多应用 SPA fallback
      // 纯静态托管没有服务端路由：直接访问 /yuwen/teacher 这类深链会 404。
      // GitHub Pages 对所有缺失路径返回站点根的 404.html（本文件），
      // 这里按路径前缀跳回对应应用的 index.html，用 ?p= 带上原始完整路径，
      // 由各应用 index.html 顶部的恢复脚本 history.replaceState 还原。
      (function () {
        var l = window.location
        var p = l.pathname
        var app
        if (p === '/yuwen' || p.indexOf('/yuwen/') === 0) app = '/yuwen/index.html'
        else if (p === '/music' || p.indexOf('/music/') === 0) app = '/music/index.html'
        else if (p === '/math' || p.indexOf('/math/') === 0) app = '/math/index.html'
        else if (p === '/english' || p.indexOf('/english/') === 0) app = '/english/index.html'
        else app = '/index.html'
        var full = p + l.search + l.hash
        l.replace(app + '?p=' + encodeURIComponent(full))
      })()
    </script>
  </head>
  <body style="font-family: system-ui; text-align: center; padding-top: 40vh; color: #999">
    跳转中…
  </body>
</html>
